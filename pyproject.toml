[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sfg_zenoh_domain_bridge"
version = "0.1.0"
description = "A Zenoh client that bridges communication between two ROS domain IDs."
authors = [
    { name = "Constantin Blessing", email = "constantin.blessing@hs-esslingen.de" },
]
requires-python = ">=3.10"
dependencies = ["eclipse-zenoh==1.8.0", "PyYAML"]

[project.scripts]
sfg-zenoh-domain-bridge = "sfg_zenoh_domain_bridge.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sfg_zenoh_domain_bridge*"]
